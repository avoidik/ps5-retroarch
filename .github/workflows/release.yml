name: release

# Builds the whole payload from the recipes in this repository - patched SDL,
# frontend, all cores, menu assets, databases - and publishes it as two zips: the
# engine (frontend, assets, databases) and the cores, one matrix job per core.
# Nothing generated is committed, so this workflow is the only source of releases.
#
# Builds are triggered by hand - pushing to master does not build anything.
on:
  # Run it from the Actions tab. Supply a tag for a versioned release; leave it
  # empty to refresh the rolling "latest" prerelease.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0). Leave empty to update the rolling "latest" release.'
        required: false
        default: ''
  push:
    # A v* tag publishes a versioned release. Tagging is deliberate, so this stays;
    # ordinary pushes to master are not built.
    tags:
      - 'v*'

permissions:
  contents: write

# One release build at a time per ref. Two overlapping runs would race on
# deleting and recreating the rolling "latest" release; a full run is long, so
# a second dispatch queues rather than cancelling the one in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk

jobs:
  # ---------------------------------------------------------------- toolchain
  # The SDK and sysroot are ~350 MB of downloads. Fetch once, cache, and let the
  # frontend and core jobs restore it.
  sdk:
    runs-on: ubuntu-24.04
    outputs:
      key: ${{ steps.k.outputs.key }}
    steps:
      - id: k
        run: echo "key=ps5-sdk-$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Make the SDK path writable for the cache
        # actions/cache extracts without sudo, and /opt is root-owned on the
        # runner, so the restore cannot create /opt/ps5-payload-sdk on its own.
        run: sudo install -d -o "$USER" /opt/ps5-payload-sdk

      - name: Restore SDK cache
        id: cache
        uses: actions/cache@v6
        with:
          path: /opt/ps5-payload-sdk
          key: ${{ steps.k.outputs.key }}

      - name: Install prerequisites
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          # llvm-18-dev is missing from the SDK's documented prerequisites. Without
          # llvm-config the compiler wrappers resolve to an empty path and every
          # build fails with "/llvm-clang++: No such file or directory".
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            clang-18 lld-18 llvm-18 llvm-18-dev \
            build-essential cmake wget unzip pkg-config python3

      - name: Install SDK and prebuilt sysroot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -q -d /opt ps5-payload-sdk.zip
          # ~339 MB of third-party libs (SDL2, ffmpeg, freetype, FLAC, zlib and
          # ~180 more). Extracts over / and lands under /opt/ps5-payload-sdk.
          wget -q https://github.com/ps5-payload-dev/pacbrew-repo/releases/latest/download/ps5-payload-dev.tar.gz
          sudo tar xf ps5-payload-dev.tar.gz -C /
          # Owned by the runner user, so build-sdl.sh can install into the sysroot
          # without sudo and the cache restores with the same ownership.
          sudo chown -R "$USER" /opt/ps5-payload-sdk
          test -x /opt/ps5-payload-sdk/bin/prospero-clang
          test -d /opt/ps5-payload-sdk/target/user/homebrew/lib

      - name: Provide libm/librt stubs
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # Math and POSIX-realtime live in libc on this target, so -lm and -lrt
          # have nothing to resolve to. Empty archives satisfy the linker and add
          # no symbols; upstream's own libm.a is a zero-byte placeholder too.
          for l in libm librt; do
            f="$PS5_PAYLOAD_SDK/target/lib/$l.a"
            [ -f "$f" ] || "$PS5_PAYLOAD_SDK/bin/prospero-ar" rcs "$f"
          done

  # ------------------------------------------------------------------ frontend
  frontend:
    needs: sdk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Make the SDK path writable for the cache
        # actions/cache extracts without sudo, and /opt is root-owned on the
        # runner, so the restore cannot create /opt/ps5-payload-sdk on its own.
        run: sudo install -d -o "$USER" /opt/ps5-payload-sdk
      - uses: actions/cache@v6
        with:
          path: /opt/ps5-payload-sdk
          key: ${{ needs.sdk.outputs.key }}
          fail-on-cache-miss: true
      - name: Install prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            clang-18 lld-18 llvm-18 llvm-18-dev build-essential cmake wget unzip \
            pkg-config python3

      - name: Build patched SDL
        # Must precede the frontend: it replaces the stock libSDL2.a in the
        # sysroot with one that feeds touchpad contact into SDL's mouse state.
        run: |
          chmod +x build-sdl.sh
          ./build-sdl.sh

      - name: Build frontend
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify the frontend
        run: |
          set -e
          test -f retroarch.elf
          echo "retroarch.elf: $(stat -c%s retroarch.elf) bytes"
          readelf -h retroarch.elf | grep -qE 'Class:\s+ELF64'
          readelf -dW retroarch.elf | grep -q 'libkernel_web.sprx'
          # The touchpad patch has to survive into the linked binary, or the
          # feature silently disappears from the release.
          strings retroarch.elf | grep -q 'PS5_TOUCHPAD_MAX_X' \
            || { echo "error: touchpad patch missing from retroarch.elf"; exit 1; }
          echo "ok"

      - uses: actions/upload-artifact@v7
        with:
          name: frontend
          # Intermediate: only the release assets are kept.
          retention-days: 1
          path: |
            retroarch.elf
            retroarch.cfg
            sce_sys/**
          if-no-files-found: error

  # ---------------------------------------------------------------------- plan
  # The core list comes from cores/typical/table.txt, cores/patched/ and
  # cores/websrv/ - the same set `build-core.sh --list` reports - so adding a
  # core needs no workflow change.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      cores: ${{ steps.list.outputs.cores }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: python3 cores/_matrix.py | tee -a "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------- cores
  cores:
    needs: [sdk, plan]
    runs-on: ubuntu-24.04
    # The slowest cores (MAME/FB Alpha derivatives) take well under an hour; a
    # build still running after two has hung, and should not hold a runner for
    # the six-hour default.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        core: ${{ fromJSON(needs.plan.outputs.cores) }}
    steps:
      - uses: actions/checkout@v7
      - name: Make the SDK path writable for the cache
        # actions/cache extracts without sudo, and /opt is root-owned on the
        # runner, so the restore cannot create /opt/ps5-payload-sdk on its own.
        run: sudo install -d -o "$USER" /opt/ps5-payload-sdk
      - uses: actions/cache@v6
        with:
          path: /opt/ps5-payload-sdk
          key: ${{ needs.sdk.outputs.key }}
          fail-on-cache-miss: true
      - name: Install prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            clang-18 lld-18 llvm-18 llvm-18-dev build-essential cmake wget unzip \
            pkg-config python3 autoconf automake libtool libtool-bin ninja-build
        # autoconf/automake/libtool: cores that build bundled dependencies run
        # their autogen.sh (dosbox_core's FLAC). Ubuntu's libtool package only
        # has libtoolize; the libtool program autogen.sh checks for is in
        # libtool-bin. ninja-build: dosbox_core configures its CMake
        # dependencies with -G Ninja (the runner image happens to ship ninja,
        # but nothing guarantees it).

      - name: Retry downloads
        # Every recipe fetches with wget - the websrv and standalone scripts
        # directly - and one transient failure among this many jobs would block
        # the release. ~/.wgetrc gives all of them retries without editing each.
        run: |
          printf '%s\n' 'tries = 5' 'waitretry = 10' 'retry_connrefused = on' \
            'timeout = 60' > ~/.wgetrc

      - name: Build ${{ matrix.core }}
        run: |
          chmod +x ./build-core.sh cores/patched/*.sh cores/websrv/*.sh
          ./build-core.sh ${{ matrix.core }}

      - name: Verify the core is loadable on-console
        run: |
          set -e
          so=$(ls .config/retroarch/cores/*_libretro.so)
          echo "built: $so ($(stat -c%s "$so") bytes)"
          readelf -h "$so" | grep -qE 'Class:\s+ELF64'
          readelf -h "$so" | grep -qE 'Type:\s+DYN'
          # libkernel_sys is absent from websrv's process; a module importing it
          # fails to load with no error shown on-screen.
          readelf -dW "$so" | grep -q 'libkernel_web.sprx'
          if readelf -dW "$so" | grep -q 'libkernel_sys.sprx'; then
            echo "error: $so imports libkernel_sys.sprx"; exit 1
          fi
          for sym in retro_init retro_run retro_load_game retro_get_system_info; do
            "$PS5_PAYLOAD_SDK/bin/prospero-nm" -D --defined-only "$so" | grep -qw "$sym"
          done
          # A core wanting a hardware GL context cannot run on this build at all.
          info=$(ls .config/retroarch/cores/*_libretro.info 2>/dev/null || true)
          if [ -n "$info" ] && grep -q 'hw_render *= *"true"' "$info"; then
            echo "error: $info declares hw_render = true"; exit 1
          fi
          echo "ok"

      - uses: actions/upload-artifact@v7
        with:
          name: core-${{ matrix.core }}
          # Intermediate: only the release assets are kept.
          retention-days: 1
          path: .config/retroarch/cores/*_libretro.*
          if-no-files-found: error

  # ------------------------------------------------------- assets + databases
  content:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y wget
      - name: Fetch menu assets and databases
        run: |
          printf '%s\n' 'tries = 5' 'waitretry = 10' 'retry_connrefused = on' \
            'timeout = 60' > ~/.wgetrc
          chmod +x fetch-assets.sh fetch-databases.sh
          ./fetch-assets.sh
          ./fetch-databases.sh
          du -sh .config/retroarch/assets .config/retroarch/database
      - uses: actions/upload-artifact@v7
        with:
          name: content
          # Intermediate: only the release assets are kept.
          retention-days: 1
          path: .config/retroarch/
          if-no-files-found: error

  # ------------------------------------------------------------------- package
  package:
    needs: [plan, frontend, cores, content]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Two release assets, both rooted at RetroArch/ so they unzip into the same
      # folder: the engine (frontend, menu assets, databases) and the cores.
      # Updating only the cores, or only the frontend, means replacing one zip.
      - name: Collect the frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend
          path: dist/engine/RetroArch

      - name: Collect assets and databases
        uses: actions/download-artifact@v8
        with:
          name: content
          path: dist/engine/RetroArch/.config/retroarch

      - name: Collect the cores
        uses: actions/download-artifact@v8
        with:
          pattern: core-*
          merge-multiple: true
          path: dist/cores/RetroArch/.config/retroarch/cores

      - name: Assemble the engine
        run: |
          cd dist/engine/RetroArch
          cp ../../../homebrew.js .
          cp ../../../README.md ../../../LICENSE .
          # RetroArch needs these to exist for BIOS files and ROMs; git cannot
          # carry an empty directory, so create them here.
          mkdir -p .config/retroarch/system .config/retroarch/roms
          touch .config/retroarch/system/.keep .config/retroarch/roms/.keep
          chmod +x retroarch.elf
          echo "=== engine contents ==="
          ls -l
          du -sh .

      - name: Sanity-check both payloads before publishing
        env:
          EXPECTED: ${{ needs.plan.outputs.count }}
        run: |
          set -e
          cd dist/engine/RetroArch
          for f in retroarch.elf retroarch.cfg homebrew.js sce_sys/icon0.png; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          test -d .config/retroarch/assets
          test -d .config/retroarch/database
          # The engine must not carry cores, or the two zips would overlap.
          test ! -d .config/retroarch/cores
          cd ../../cores/RetroArch
          n=$(find .config/retroarch/cores -maxdepth 1 -name "*.so" | wc -l)
          i=$(find .config/retroarch/cores -maxdepth 1 -name "*.info" | wc -l)
          [ "$n" -ge "$EXPECTED" ] || { echo "only $n cores, expected $EXPECTED"; exit 1; }
          [ "$i" -ge "$n" ] || { echo "$n cores but only $i .info files"; exit 1; }
          echo "ok: engine complete, $n cores"

      - name: Create the zips
        run: |
          set -e
          (cd dist/engine && zip -qr9 ../../RetroArch-PS5-engine.zip RetroArch)
          (cd dist/cores && zip -qr9 ../../RetroArch-PS5-cores.zip RetroArch)
          ls -l RetroArch-PS5-*.zip
          sha256sum RetroArch-PS5-*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: RetroArch-PS5-engine
          path: RetroArch-PS5-engine.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: RetroArch-PS5-cores
          path: RetroArch-PS5-cores.zip
          if-no-files-found: error

      # Every successful build publishes something downloadable:
      #   v* tag, or a manual run given a tag -> a versioned release
      #   a manual run with the tag left empty -> a rolling "latest" prerelease
      # The rolling one is deleted and recreated so its tag and assets always
      # point at the commit that produced them; the GitHub API will not move an
      # existing tag on its own.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          CORE_COUNT: ${{ needs.plan.outputs.count }}
        run: |
          set -e
          SHA_ENGINE=$(sha256sum RetroArch-PS5-engine.zip | cut -d' ' -f1)
          SHA_CORES=$(sha256sum RetroArch-PS5-cores.zip | cut -d' ' -f1)

          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            TITLE="RetroArch PS5 $TAG"
            FLAGS=""
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG="${{ github.ref_name }}"
            TITLE="RetroArch PS5 $TAG"
            FLAGS=""
          else
            TAG="latest"
            TITLE="RetroArch PS5 (latest build)"
            FLAGS="--prerelease"
            gh release delete "$TAG" --cleanup-tag --yes || true
          fi

          cat > notes.md <<EOF
          Two downloads, both containing a \`RetroArch\` folder:

          - **RetroArch-PS5-engine.zip** - the frontend, menu assets and databases.
          - **RetroArch-PS5-cores.zip** - $CORE_COUNT emulator cores.

          Unzip both into the same place, so the cores land in the engine's
          \`RetroArch/.config/retroarch/cores\`, then copy the \`RetroArch\` folder
          to \`homebrew/RetroArch\` on internal storage or a USB drive and launch it
          from the Homebrew Launcher. To update only the cores or only the engine,
          replace just that part. ROMs go in \`.config/retroarch/roms\`, BIOS files
          in \`.config/retroarch/system\`.

          \`\`\`
          RetroArch-PS5-engine.zip  sha256 $SHA_ENGINE
          RetroArch-PS5-cores.zip   sha256 $SHA_CORES
          built from ${GITHUB_SHA}
          \`\`\`

          The PS5 port of RetroArch is John Tornblom's, from
          [ps5-payload-dev/websrv](https://github.com/ps5-payload-dev/websrv).
          Core licences vary and several cores are non-commercial (among them the
          MAME-derived, FB Alpha/FB Neo, Snes9x and Genesis Plus GX cores) - see
          the README for each core's licence.
          EOF

          gh release create "$TAG" RetroArch-PS5-engine.zip RetroArch-PS5-cores.zip \
            --target "${GITHUB_SHA}" \
            --title "$TITLE" \
            --notes-file notes.md \
            $FLAGS

          echo "published: $TAG"
